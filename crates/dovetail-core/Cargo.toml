[package]
name = "dovetail-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The finetype-guided detector pulls finetype-model (candle ML stack). On by
# default so a normal build is the full survey; disable for fast iteration on
# the structure layer:  cargo test -p dovetail-core --no-default-features
default = ["finetype-guided"]
finetype-guided = ["dep:finetype-model"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# The Ossie model is YAML: the wire types read and write it.
serde_yaml = "0.9.34"
finetype-core = { workspace = true, features = ["embedded-taxonomy"] }
finetype-model = { workspace = true, optional = true }
parquet = { version = "53", default-features = false, features = ["arrow"] }
sha2 = "0.10"
# relate reads and queries DuckDB in-process for discovery:
# schema introspection, value-overlap/cardinality evidence, referential-integrity
# verification. Read-only discovery — execution is always an emitted
# artifact. Bundled libduckdb: DuckDB 2.0.0, the same spec as Brightfield's,
# because FineType's community extension is only current on 2.0.
duckdb = { version = "=1.20000.0", features = ["bundled"] }
# Embedded jaq for the transform shim: a pinned in-process jq-compatible engine,
# so the transform path needs no system jq.
jaq-core = "3"
jaq-std = "3"
jaq-json = "2"
# A private, unpredictably named directory to stage FineType's extension under
# the file name DuckDB loads it by.
tempfile = "3"

[dev-dependencies]
# Descriptor conformance is checked in the test suite only — jsonschema
# stays out of the runtime dependency graph.
jsonschema = "0.26"
