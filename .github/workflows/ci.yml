name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref — the newest push is the one that matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting is build-free, so it reports in seconds and never waits on the
  # compile below.
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Pinned toolchain. rustfmt's default style and clippy's lint set both move
      # between releases, so an unpinned rustc could turn a gate red on a commit
      # that changed nothing. There is no rustfmt.toml, so this pin *is* the style.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
          components: rustfmt
      - run: cargo fmt --all --check

  # Clippy, rustdoc and the test suite share one job because they share one
  # dependency graph, and building it is the expensive part: dovetail links
  # DuckDB through the `duckdb` crate's `bundled` feature, which compiles the
  # C++ amalgamation from source. There is no system-library install step to
  # look for — the crate builds its own, and `Cargo.lock` pins which.
  #
  # The 90-minute ceiling is sized for a COLD run, where that DuckDB build and
  # the candle stack behind `finetype-guided` are both compiled from scratch.
  # Once `rust-cache` has a hit, the job is a recompile of this workspace's own
  # crates.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
          components: clippy
      - uses: Swatinem/rust-cache@v2

      # `--all-targets` so the integration tests under crates/*/tests are linted
      # too, not just the library and the binary.
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # rustdoc, for defects that live in doc comments — among them a doc link
      # naming something that does not exist. `cargo doc` resolves intra-doc
      # links and warns on the ones it cannot, and rustdoc's other doc lints
      # warn here as well; `-D warnings` turns those warnings into a failure.
      #
      # `--no-deps` so a warning in a dependency's docs cannot redden this repo.
      # `--document-private-items` so the links written inside private items are
      # resolved as well — a doc comment on a private item is read by the next
      # person to change that code.
      - name: cargo doc (intra-doc links must resolve)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --document-private-items

      - name: test
        run: cargo test --workspace

      # The default-features run above does not compile the
      # `#[cfg(not(feature = "finetype-guided"))]` fallbacks in
      # crates/dovetail/src/main.rs, so nothing so far has checked the
      # structural-only build that `--no-default-features` produces. Feature
      # resolution is what changes here; the dependency graph is a subset of the
      # one already built, so this adds a recompile of the workspace's own
      # crates rather than a second cold build.
      - name: clippy (no default features)
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

      - name: test (no default features)
        run: cargo test --workspace --no-default-features

  # The same gates on macOS, so "green" answers for the platform the
  # `--no-default-features` binary is built and demonstrated on as well as for
  # the runner's. Both jobs above are ubuntu-only, and a job that runs on one
  # operating system cannot report on a result that differs between two: the
  # question "does this behave the same on macOS" was decidable only by a human
  # running it by hand, and a hand-run result is not evidence anyone else can
  # read.
  #
  # Scoped to the `--no-default-features` half deliberately. That feature set
  # drops `finetype-guided` and with it the candle stack, so this job compiles
  # the bundled DuckDB and the value-only typing path and stops — the
  # configuration whose portability was in question. Widening it to the default
  # features would re-check a model path that the ubuntu-latest job already
  # covers.
  build-macos:
    runs-on: macos-latest
    # Sized for a cold run, matching the ceiling on the job above: the bundled
    # DuckDB amalgamation is the dominant cost and it is compiled from source
    # here too.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: clippy (no default features)
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

      - name: test (no default features)
        run: cargo test --workspace --no-default-features
